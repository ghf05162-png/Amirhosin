<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت امیر گراف</title><style>body{font-family:system-ui;background:#090b10;color:#eee;margin:0;padding:24px}main{max-width:1100px;margin:auto}.box{background:#11151d;border:1px solid #2b303b;border-radius:20px;padding:20px;margin:15px 0}input,button{padding:12px;border-radius:10px;border:1px solid #333;background:#0c0f15;color:#fff}button{cursor:pointer;background:#b58a45}.order{padding:14px;border-top:1px solid #292d36}</style></head><body><main><h1>پنل مدیریت امیر گراف</h1><div class="box"><input id="pass" type="password" placeholder="رمز مدیریت"><button onclick="load()">دریافت سفارش‌ها</button></div><div id="out" class="box">وارد شوید.</div></main><script>async function load(){const p=document.getElementById('pass').value,o=document.getElementById('out');o.textContent='در حال دریافت...';try{const r=await fetch('/api/admin-orders',{headers:{Authorization:'Bearer '+p}}),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');o.innerHTML=d.length?d.map(x=>'<div class="order"><b>'+x.customer_name+'</b><br>'+x.mobile+'<br>'+Number(x.amount_toman).toLocaleString('fa-IR')+' تومان<br>'+x.status+'</div>').join(''):'سفارشی وجود ندارد.'}catch(e){o.textContent=e.message}}</script></body></html>
